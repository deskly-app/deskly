<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Saira:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>Deskly</title>
    <script>
      (function() {
        window.__BOOT_START__ = Date.now();
        try {
          if (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
            document.documentElement.classList.add('mobile-ui');
          }
          var storageKey = 'vite-ui-theme';
          var savedTheme = localStorage.getItem(storageKey) || 'dark';
          var theme = savedTheme;
          if (theme === 'system') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.classList.remove('light', 'dark');
          document.documentElement.classList.add(theme);
        } catch (e) {}
      })();
    </script>
    <style>
      #mobile-boot-splash {
        display: none;
      }
      html.mobile-ui #mobile-boot-splash {
        display: flex;
        position: fixed;
        inset: 0;
        z-index: 99999;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0;
        background-color: oklch(0.205 0 0);
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        opacity: 1;
        transition: opacity 300ms cubic-bezier(0.16, 1, 0.3, 1);
        will-change: opacity;
      }
      html.mobile-ui.light #mobile-boot-splash {
        background-color: oklch(0.98 0 0);
      }
      #mobile-boot-splash.fade-out {
        opacity: 0 !important;
        pointer-events: none !important;
      }

      /* Keyframes */
      @keyframes boot-fade-up {
        from { opacity: 0; transform: translateY(16px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes boot-fade-in {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
      @keyframes boot-bar-grow {
        from { width: 0%; }
        to   { width: 100%; }
      }

      /* Logo */
      .boot-logo {
        width: 64px;
        height: 64px;
        object-fit: contain;
        opacity: 0;
        animation: boot-fade-up 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards;
        will-change: opacity, transform;
      }

      /* Loading bar */
      .boot-bar-track {
        margin-top: 52px;
        width: 80px;
        height: 1.5px;
        background-color: oklch(0.32 0 0);
        border-radius: 99px;
        overflow: hidden;
        opacity: 0;
        animation: boot-fade-in 0.4s ease 0.55s forwards;
      }
      html.mobile-ui.light .boot-bar-track {
        background-color: oklch(0.82 0 0);
      }
      .boot-bar-fill {
        height: 100%;
        width: 0%;
        background-color: oklch(0.985 0 0);
        border-radius: 99px;
        animation: boot-bar-grow 1.6s cubic-bezier(0.16, 1, 0.3, 1) 0.65s forwards;
        will-change: width;
      }
      html.mobile-ui.light .boot-bar-fill {
        background-color: oklch(0.145 0 0);
      }
    </style>
  </head>

  <body>
    <div id="mobile-boot-splash">
      <img src="/logo.png" alt="Deskly Logo" class="boot-logo" />
      <div class="boot-bar-track">
        <div class="boot-bar-fill"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
