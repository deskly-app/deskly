<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Saira:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>Deskly</title>
    <script>
      (function() {
        try {
          if (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
            document.documentElement.classList.add('mobile-ui');
          }
          var storageKey = 'vite-ui-theme';
          var savedTheme = localStorage.getItem(storageKey) || 'dark';
          var theme = savedTheme;
          if (theme === 'system') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.classList.remove('light', 'dark');
          document.documentElement.classList.add(theme);
        } catch (e) {}
      })();
    </script>
    <style>
      #mobile-boot-splash {
        display: none;
      }
      html.mobile-ui #mobile-boot-splash {
        display: flex;
        position: fixed;
        inset: 0;
        z-index: 99999;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: oklch(0.205 0 0);
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        opacity: 1;
        transition: opacity 200ms cubic-bezier(0.16, 1, 0.3, 1);
        will-change: opacity;
      }
      html.mobile-ui.light #mobile-boot-splash {
        background-color: oklch(0.90 0 0);
      }
      .mobile-boot-logo {
        width: 110px;
        height: 110px;
        object-fit: contain;
      }
      #mobile-boot-splash.fade-out {
        opacity: 0 !important;
        pointer-events: none !important;
      }
    </style>
  </head>

  <body>
    <div id="mobile-boot-splash">
      <img src="/logo.png" alt="Deskly Logo" class="mobile-boot-logo" />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
